name: Publish and Release

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'
  schedule:
    - cron: '0 0 * * 0' # Rebuild every Sunday at midnight
  workflow_dispatch:
    inputs:
      release_suffix:
        description: 'Release suffix (e.g. 1, 2, etc.) to trigger a manual release'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up short SHA
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Build image using Buildah
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: flm-portable
          tags: latest ${{ env.SHORT_SHA }}
          containerfiles: ./Containerfile

      - name: Extract files and generate tarball
        run: |
          # Create a container from the built image
          podman create --name extract localhost/flm-portable:latest
          
          # Extract Bill of Materials (BOM)
          podman cp extract:/share/flm/BOM.txt .
          
          # Parse the upstream FastFlowLM RPM version
          RPM_VERSION=$(grep "^fastflowlm:" BOM.txt | awk '{print $2}' | cut -d'-' -f1)
          echo "RPM_VERSION=${RPM_VERSION}" >> $GITHUB_ENV
          
          # Extract all files for the tarball
          mkdir -p /tmp/dist
          podman cp extract:/bin /tmp/dist/
          podman cp extract:/lib64 /tmp/dist/
          podman cp extract:/share /tmp/dist/
          podman cp extract:/flm-wrapper /tmp/dist/
          
          # Create the tarball
          tar -czf flm-portable.tar.gz -C /tmp/dist .
          
          # Cleanup
          podman rm extract

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push latest/main image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: latest main-${{ env.SHORT_SHA }}
          registry: ghcr.io/${{ github.repository_owner }}

      - name: Determine Release Version
        run: |
          if [[ "${{ github.ref_name }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            VERSION="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.release_suffix }}" ]; then
            VERSION="${{ env.RPM_VERSION }}-${{ github.event.inputs.release_suffix }}"
          else
            VERSION="${{ env.RPM_VERSION }}-weekly-$(date +'%Y%m%d')"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Release version is ${VERSION}"

      - name: Push version-tagged image to GHCR
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_suffix != '')
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ env.VERSION }}
          registry: ghcr.io/${{ github.repository_owner }}

      - name: Create GitHub Release and Upload Artifact
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_suffix != '')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Build release notes with the BOM details
          echo "## FastFlowLM Linux Portable Release" > release_notes.md
          echo "" >> release_notes.md
          echo "This is a self-contained portable build of FastFlowLM for Linux." >> release_notes.md
          echo "" >> release_notes.md
          echo "### Bill of Materials (BOM)" >> release_notes.md
          echo '```' >> release_notes.md
          cat BOM.txt >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### Running Instructions" >> release_notes.md
          echo "Extract the tarball and run the wrapper script:" >> release_notes.md
          echo "\`\`\`bash" >> release_notes.md
          echo "tar -xzf fastflowlm-portable-${{ env.VERSION }}.tar.gz" >> release_notes.md
          echo "./flm-wrapper run llama3.2:1b" >> release_notes.md
          echo "\`\`\`" >> release_notes.md
          
          # Rename tarball for release
          mv flm-portable.tar.gz fastflowlm-portable-${{ env.VERSION }}.tar.gz
          
          # Create Release via GitHub CLI
          gh release create "${{ env.VERSION }}" \
            --title "Release ${{ env.VERSION }}" \
            --notes-file release_notes.md \
            fastflowlm-portable-${{ env.VERSION }}.tar.gz
