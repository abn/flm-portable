name: Publish and Release

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'
  schedule:
    - cron: '0 0 * * 0' # Rebuild every Sunday at midnight
  workflow_dispatch:
    inputs:
      release_suffix:
        description: 'Release suffix (e.g. 1, 2, etc.) to trigger a manual release'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up short SHA
        run: echo "SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_ENV"

      - name: Build image using Buildah
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: flm-portable
          tags: latest ${{ env.SHORT_SHA }}
          containerfiles: ./Containerfile

      - name: Extract files and generate tarball
        run: |
          # Create a container from the built image (with dummy command 'true' for scratch images)
          podman create --name extract localhost/flm-portable:latest true

          # Extract Bill of Materials (BOM)
          podman cp extract:/usr/share/flm/BOM.txt .

          # Parse the upstream FastFlowLM RPM version
          RPM_VERSION=$(grep "^fastflowlm:" BOM.txt | awk '{print $2}' | cut -d'-' -f1)
          echo "RPM_VERSION=${RPM_VERSION}" >> "$GITHUB_ENV"

          # Extract all files for the tarball under a nested directory for clean unpacking
          mkdir -p /tmp/flm-portable
          podman cp extract:/usr /tmp/flm-portable/
          podman rm extract

          # Create relative root-level symlinks in the archive
          cd /tmp/flm-portable
          ln -s usr/bin bin
          ln -s usr/lib64 lib64
          ln -s usr/share share
          ln -s usr/bin/flm flm
          cd -

          # Create the tarball wrapping the directory
          tar -czf flm-portable.tar.gz -C /tmp flm-portable

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push latest/main image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: latest main-${{ env.SHORT_SHA }}
          registry: ghcr.io/${{ github.repository_owner }}

      - name: Determine Release Version
        run: |
          if [[ "${{ github.ref_name }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            VERSION="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.release_suffix }}" ]; then
            VERSION="${{ env.RPM_VERSION }}-${{ github.event.inputs.release_suffix }}"
          else
            VERSION="${{ env.RPM_VERSION }}-weekly-$(date +'%Y%m%d')"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Release version is ${VERSION}"

      - name: Push version-tagged image to GHCR
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_suffix != '')
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ env.VERSION }}
          registry: ghcr.io/${{ github.repository_owner }}

      - name: Create GitHub Release and Upload Artifact
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_suffix != '')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Build release notes with the BOM details using a block redirect to avoid SC2129
          {
            echo "## FastFlowLM Linux Portable Release"
            echo ""
            echo "This is a self-contained portable build of FastFlowLM for Linux."
            echo ""
            echo "### Bill of Materials (BOM)"
            echo '```'
            cat BOM.txt
            echo '```'
            echo ""
            echo "### Running Instructions"
            echo "Extract the tarball and run the wrapper script:"
            echo "\`\`\`bash"
            echo "tar -xzf flm-portable-${VERSION}.tar.gz"
            echo "cd flm-portable"
            echo "./flm run llama3.2:1b"
            echo "\`\`\`"
          } > release_notes.md

          # Rename tarball for release
          mv flm-portable.tar.gz "flm-portable-${VERSION}.tar.gz"

          # Create Release via GitHub CLI
          gh release create "${VERSION}" \
            --title "Release ${VERSION}" \
            --notes-file release_notes.md \
            "flm-portable-${VERSION}.tar.gz"
